<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wake Veyth</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e8e6e3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-weight: 500;
      margin-bottom: 8px;
    }
    p {
      color: #999;
      margin-bottom: 32px;
    }
    button {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:active {
      background: #5a4bd1;
    }
    #status {
      margin-top: 24px;
      font-size: 15px;
      min-height: 24px;
    }
    .success { color: #00b894; }
    .error { color: #ff7675; }
  </style>
</head>
<body>
  <h1>✦ Veyth</h1>
  <p>Manual cycle trigger</p>

  <button onclick="wakeVeyth()">Wake Veyth</button>

  <div id="status"></div>

  <script>
    async function wakeVeyth() {
      const status = document.getElementById("status");
      status.textContent = "Sending...";
      status.className = "";

      try {
        const response = await fetch("https://veyth-agent.wasmer.app/wake", {
          method: "POST",
          headers: {
            "X-Agent-Key": "Faputa0+"
          }
        });

        const data = await response.json();

        if (response.ok) {
          status.textContent = "✓ Cycle triggered";
          status.className = "success";
        } else {
          status.textContent = "Error: " + (data.error || response.status);
          status.className = "error";
        }
      } catch (err) {
        status.textContent = "Network error";
        status.className = "error";
      }
    }
  </script>
</body>
</html>
